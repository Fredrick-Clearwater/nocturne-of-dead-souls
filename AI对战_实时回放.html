<script>
(function(){
  var ROLE_EMOJI = {"莱莱可":"🗡","门先生":"🛡","米提亚":"👁","降临者":"⚡","水妖":"🌊",
                    "普通人":"🎭","魂灵":"👻","死神":"💀","夜祷":"🕯"};
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function render(s){
    var alive = s.players.filter(function(p){return p.alive;}).length;
    var hum = s.players.filter(function(p){return p.alive && p.faction==="human";}).length;
    var det = alive - hum;
    var phase = s.done ? ("对局已结束 · 共 " + s.night + " 夜 · 存活 " + alive + "（人 " + hum + " / 死亡阵营 " + det + "）")
                       : ("对局进行中 · 当前第 " + s.night + " 夜 · 存活 " + alive + "（人 " + hum + " / 死亡阵营 " + det + "）");
    document.getElementById("status").innerHTML = esc(phase) + (s.done ? "" : '<span class="live"> ● LIVE</span>');
    document.getElementById("banner").innerHTML = s.winner
      ? (s.winner === "human"
         ? "<div class='banner'>🏆 人类阵营胜利 — 大幕落下，晨光照进剧院</div>"
         : "<div class='banner death'>🩸 死亡阵营胜利 — 屠城之夜，曲终人散</div>")
      : "";
    // 名录
    document.getElementById("seats").innerHTML = s.players.map(function(p){
      var st = p.alive ? "存活" : ("出局（" + esc(p.cause || "？") + "）");
      if(!p.alive && p.faction === "death" && p.role !== "魂灵") st += " · 可能回归";
      var lead = (p.id === s.leader && p.alive) ? " <span class='lead'>领袖</span>" : "";
      var mdl = p.model ? " · <span class='mdl'>🤖 " + esc(p.model) + "</span>" : "";
      return "<div class='seat " + (p.alive ? "" : "dead") + " f-" + esc(p.faction) + "'>"
           + "<div class='no'>" + (p.id + 1) + "</div>"
           + "<div><div class='role'>" + (ROLE_EMOJI[p.role] || "") + " " + esc(p.name) + " · " + esc(p.role) + "</div>"
           + "<div class='st'>" + st + lead + mdl + "</div></div></div>";
    }).join("");
    // 记事：按阶段分组，最新在上
    var phases = [], cur = null;
    (s.log || []).forEach(function(e){
      var key = e.phase || "白天";
      if(!cur || cur[0] !== key){ cur = [key, []]; phases.push(cur); }
      cur[1].push(e);
    });
    document.getElementById("feed").innerHTML = phases.slice().reverse().map(function(ph){
      var key = ph[0], evs = ph[1];
      var isNight = key.indexOf("夜") >= 0;
      var head = "<h3 class='" + (isNight ? "night' >" : "dayl'>") + esc(key)
               + "<span class='lat'>" + (isNight ? "Nocturne" : "Interlude") + "</span></h3>";
      var body = evs.map(function(e){
        var et = e.type, cls = "ev announce", txt = esc(e.text || "");
        if(et === "speech") cls = "ev speech";
        else if(et === "secret" || et === "night_act" || et === "wolf_chat") cls = "ev secret";
        else if(et === "death") cls = "ev death";
        else if(et === "return") cls = "ev return";
        else if(et === "announce") cls = txt.indexOf("🗳") === 0 ? "ev vote" : "ev announce";
        if(et === "night_result") return "";
        var who = (e.who && et === "speech") ? "<b>" + esc(e.who) + "：</b>" : "";
        return "<div class='" + cls + "'>" + who + txt + "</div>";
      }).join("");
      return "<div class='day'>" + head + body + "</div>";
    }).join("");
  }
  function poll(){
    fetch("AI对战_战况.json", {cache:"no-store"}).then(function(r){return r.json();}).then(function(s){
      if(s && !s.none) render(s);
    }).catch(function(){});
  }
  poll(); setInterval(poll, 2000);
})();
</script>
<script>
(function(){
  var c=document.getElementById("snow"),x=c.getContext("2d"),fl=[];
  function rs(){c.width=innerWidth;c.height=innerHeight;}rs();addEventListener("resize",rs);
  for(var i=0;i<70;i++)fl.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.4,s:Math.random()*.5+.15,o:Math.random()*.5+.15});
  (function tick(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#eef2f7";
    for(var i=0;i<fl.length;i++){var f=fl[i];f.y+=f.s;f.x+=Math.sin(f.y*.01)*.3;if(f.y>c.height){f.y=-4;f.x=Math.random()*c.width;}
      x.globalAlpha=f.o;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();}
    requestAnimationFrame(tick);})();
})();
</script>
